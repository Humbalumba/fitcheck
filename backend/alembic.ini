# Alembic config for FitCheck. The database URL comes from DATABASE_URL (see app/db.py: database_url()).
# Upgrade:  cd backend && DATABASE_URL=postgres://... alembic upgrade head
# The app also runs "upgrade head" on startup (guarded by a Postgres advisory lock).
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
